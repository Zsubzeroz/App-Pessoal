<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Central de Produtividade</title>

    <meta name="description" content="Central de Produtividade - Organize sua rotina, estudos e carreira." />
    <meta name="theme-color" content="#0a0d13" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Central" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { font-family: 'Inter', sans-serif; background: #0a0d13; color: #f4f4f5; }

      .login-screen {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: radial-gradient(circle at 50% 30%, rgba(79,195,255,0.06), transparent 50%);
      }
      .login-card {
        background: #0d1119;
        border: 1px solid #212a38;
        border-radius: 24px;
        padding: 48px;
        text-align: center;
        max-width: 420px;
        width: 90%;
        box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      }
      .login-logo {
        width: 64px; height: 64px;
        background: linear-gradient(135deg, #4fc3ff, #34e0a1);
        border-radius: 18px;
        display: flex; align-items: center; justify-content: center;
        margin: 0 auto 24px;
        font-size: 28px;
      }
      .login-card h1 { font-size: 1.5rem; font-weight: 800; margin-bottom: 8px; }
      .login-card p { color: #8d97a8; font-size: 0.9rem; margin-bottom: 24px; }

      .login-form { display: flex; flex-direction: column; gap: 12px; }
      .login-input {
        background: #131924;
        border: 1px solid #212a38;
        color: #f4f4f5;
        padding: 14px 16px;
        border-radius: 12px;
        font-size: 0.95rem;
        outline: none;
        font-family: inherit;
        transition: border-color 0.2s;
      }
      .login-input:focus { border-color: #4fc3ff; }
      .login-input::placeholder { color: #5c6577; }

      .login-btn {
        background: linear-gradient(135deg, #4fc3ff, #34e0a1);
        color: #0a0d13;
        border: none;
        padding: 14px;
        border-radius: 12px;
        font-size: 0.95rem;
        font-weight: 700;
        cursor: pointer;
        transition: opacity 0.2s, transform 0.2s;
      }
      .login-btn:hover { opacity: 0.9; transform: translateY(-1px); }
      .login-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

      .login-toggle {
        background: none;
        border: none;
        color: #4fc3ff;
        cursor: pointer;
        font-size: 0.85rem;
        margin-top: 8px;
        font-family: inherit;
      }
      .login-toggle:hover { text-decoration: underline; }

      .login-error {
        background: rgba(239, 68, 68, 0.1);
        border: 1px solid rgba(239, 68, 68, 0.2);
        color: #ef4444;
        padding: 10px;
        border-radius: 8px;
        font-size: 0.85rem;
        display: none;
      }

      .login-footer { margin-top: 24px; font-size: 0.7rem; color: #3a4252; }

      .app-layout { display: flex; min-height: 100vh; }
    </style>
  </head>
  <body>

    <!-- Login Screen -->
    <div id="login-screen" class="login-screen">
      <div class="login-card">
        <div class="login-logo"><i class="fas fa-bolt"></i></div>
        <h1 id="login-title">Entrar</h1>
        <p id="login-subtitle">Acesse sua conta para continuar.</p>

        <div id="login-error" class="login-error"></div>

        <form id="login-form" class="login-form">
          <input type="text" id="login-username" class="login-input" placeholder="Usuário" autocomplete="username" required minlength="3">
          <input type="password" id="login-password" class="login-input" placeholder="Senha" autocomplete="current-password" required minlength="4">
          <button type="submit" id="login-submit" class="login-btn">Entrar</button>
        </form>

        <button id="login-toggle" class="login-toggle">Não tem conta? Criar conta</button>
        <div class="login-footer">Desenvolvido por Luan Estifer Rodrigues Pereira (Software Engineer)</div>
      </div>
    </div>

    <!-- App Principal -->
    <div id="app-layout" class="app-layout" style="display:none;">
      <aside class="sidebar">
        <div class="sidebar-header">
          <div id="user-avatar" class="user-avatar-circle">
            <i class="fas fa-user"></i>
          </div>
          <h2 id="user-name">Usuário</h2>
          <p>Produtividade & Carreira</p>
        </div>
        <nav class="sidebar-nav">
          <div class="nav-group-label">rotina</div>
          <button class="nav-item active" data-target="rotina"><i class="fas fa-th-large"></i> <span>Minha Rotina</span></button>
          <button class="nav-item" data-target="biblia"><i class="fas fa-book-open"></i> <span>Plano Bíblico</span></button>
          <button class="nav-item" data-target="ia"><i class="fas fa-magic"></i> <span>Zen AI</span></button>
          <button class="nav-item" data-target="notas"><i class="fas fa-lightbulb"></i> <span>Ideias & Notas</span></button>
          <button class="nav-item" data-target="checklist"><i class="fas fa-check-square"></i> <span>Checklist</span></button>
          <button class="nav-item" data-target="vagas"><i class="fas fa-briefcase"></i> <span>Vagas</span></button>
          <button class="nav-item" data-target="curriculo"><i class="fas fa-file-alt"></i> <span>Currículo</span></button>
        </nav>
        <div class="sidebar-footer">
          <button id="btn-export" class="sidebar-action-btn export-btn" title="Exportar dados criptografados">
            <i class="fas fa-download"></i> <span>Exportar Dados</span>
          </button>
          <button id="btn-logout" class="sidebar-action-btn logout-btn" title="Sair da conta">
            <i class="fas fa-sign-out-alt"></i> <span>Sair</span>
          </button>
          <div class="sidebar-version">Desenvolvido por Luan Estifer Rodrigues Pereira (Software Engineer)</div>
        </div>
      </aside>
      <main class="main-content" id="app-content"></main>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
