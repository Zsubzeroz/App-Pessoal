<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Central de Produtividade</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div class="app-layout">
      <!-- Sidebar Navigation -->
      <aside class="sidebar">
        <div class="sidebar-header">
          <div class="profile-img-placeholder">
            <i class="fas fa-bolt"></i>
          </div>
          <h2>Central</h2>
          <p>Produtividade & Carreira</p>
        </div>
        <nav class="sidebar-nav">
          <div class="nav-group-label">rotina</div>
          <button class="nav-item active" data-target="rotina"><i class="fas fa-th-large"></i> <span>Minha Rotina</span></button>
          <button class="nav-item" data-target="biblia"><i class="fas fa-book-open"></i> <span>Plano Bíblico</span></button>
          <button class="nav-item" data-target="ia"><i class="fas fa-magic"></i> <span>Zen AI</span></button>
          <button class="nav-item" data-target="notas"><i class="fas fa-lightbulb"></i> <span>Ideias & Notas</span></button>
          <button class="nav-item" data-target="checklist"><i class="fas fa-check-square"></i> <span>Checklist</span></button>
          <button class="nav-item" data-target="vagas"><i class="fas fa-briefcase"></i> <span>Vagas</span></button>
          <button class="nav-item" data-target="curriculo"><i class="fas fa-file-alt"></i> <span>Currículo</span></button>
        </nav>
        <div class="sidebar-footer">
          v2.0.0
        </div>
      </aside>

      <!-- Main Content Area -->
      <main class="main-content" id="app-content">
        <!-- Views will be injected here -->
      </main>
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
